# Production Compose override:
#   cp env/.env.production.example env/.env.production
#   docker compose -f compose.yaml -f compose.prod.yaml up -d --build
#
# Uses config.settings.production, env/.env.production, PostgreSQL, Gunicorn,
# and Nginx serving /static/ and /media/.

services:
  db:
    env_file: !override
      - path: env/.env.production
        required: false

  web:
    env_file: !override
      - path: env/.env.production
        required: false
    environment:
      DJANGO_ENV: production
      DJANGO_SETTINGS_MODULE: config.settings.production
      STATIC_ROOT: /app/staticfiles
      MEDIA_ROOT: /app/media
    ports: !reset []
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os, urllib.request; host = os.environ['ALLOWED_HOSTS'].split(',')[0].strip(); req = urllib.request.Request('http://127.0.0.1:8000/sitemap.xml', headers={'Host': host, 'X-Forwarded-Proto': 'https'}); urllib.request.urlopen(req, timeout=3)",
        ]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - staticfiles_data:/app/staticfiles:ro
      - media_data:/app/media:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      web:
        condition: service_healthy
