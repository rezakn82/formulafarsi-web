map $http_x_forwarded_proto $proxy_x_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

upstream formulafarsi_web {
    server web:8000;
}

upstream formulafarsi_web {
    server web:8000;
}

# ۱. ریدایرکت تمام درخواست‌های HTTP به HTTPS و پشتیبانی از تمدید Certbot
server {
    listen 80;
    server_name formulafarsi.ir www.formulafarsi.ir;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ۲. سرور اصلی HTTPS
server {
    listen 443 ssl;
    http2 on;
    server_name formulafarsi.ir www.formulafarsi.ir;

    # مسیر گواهی‌های SSL که روی سرور گرفته‌اید
    ssl_certificate /etc/letsencrypt/live/formulafarsi.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/formulafarsi.ir/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Match django-summernote attachment limit (10 MB) plus form overhead
    client_max_body_size 20M;

    location /static/ {
        alias /app/staticfiles/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /app/media/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://formulafarsi_web;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
    }
}
