<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}پایگاه خبری موتوراسپرت و فرمول یک{% endblock %}</title>
    <!-- استایل‌های سریع Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- فونت Vazirmatn -->
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>
        body { font-family: 'Vazirmatn', sans-serif; }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen flex flex-col justify-between">

    <!-- هدر و نوبار -->
    <header class="border-b border-zinc-800 bg-zinc-900/80 backdrop-blur sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-8">
                <a href="/" class="text-2xl font-black italic tracking-wider text-red-600 flex items-center gap-1">
                    <span>FormulaFarsi</span>
                </a>
                <nav class="hidden md:flex items-center gap-6 text-sm font-medium text-zinc-300">
                    <a href="{% url 'news:home' %}" class="hover:text-red-500 transition">صفحه اصلی</a>
                    <a href="{% url 'news:articles_list' %}" class="hover:text-red-500 transition">اخبار</a>
                    <a href="{% url 'racing:standings' %}" class="hover:text-red-500 transition">جدول رده‌بندی</a>
                    <a href="{% url 'grandprix_calendar:calendar_list' %}" class="hover:text-red-500 transition">تقویم مسابقات</a>
                    <a href="{% url 'racing:drivers_list' %}" class="hover:text-red-500 transition">رانندگان</a>
                    <a href="{% url 'racing:teams_list' %}" class="hover:text-red-500 transition">تیم‌ها</a>
                </nav>
            </div>
            <div>
                <a href="/admin" target="_blank" class="text-xs bg-zinc-800 hover:bg-zinc-700 px-3 py-1.5 rounded-full transition text-zinc-300">ورود به پنل</a>
            </div>
        </div>
    </header>

    <!-- محتوای متغیر هر صفحه -->
    <main class="flex-grow max-w-7xl mx-auto px-4 py-8 w-full">
        {% block content %}
        {% endblock %}
    </main>

    <!-- فوتر -->
    <footer class="border-t border-zinc-900 bg-zinc-950 py-6 text-center text-xs text-zinc-500">
        <p>© 2026 پلتفرم خبری فرمول یک. کلیه حقوق برای کانال فرمولافارسی محفوظ است.</p>
    </footer>

    {% block extra_js %}{% endblock %}
</body>
</html>
